[mgr]
ratio          = [ 1, 3, 4 ]      # Column width ratio: [parent, current, preview]
sort_by        = "natural"        # Sort numbers naturally (1, 2, 10 instead of 1, 10, 2)
sort_dir_first = true             # Always list folders above files
show_hidden    = true             # Show hidden files by default
linemode       = "size"           # Show file sizes next to filenames (options: "size", "mtime", "permissions")
